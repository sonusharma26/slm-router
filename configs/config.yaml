# Research knobs (version-controlled). Secrets live in .env, not here.
reward:
  correctness_weight: 1.0
  lambda_cost: 50.0       # penalty weight on cost_usd (cost is tiny per call)
  beta_latency: 0.0001    # penalty weight on latency_ms

paths:
  data_dir: data
  results_dir: results
  traces_dir: data/traces
  models_dir: models

# Datasets to evaluate (v0: mmlu + gsm8k).
datasets:
  - mmlu
  - gsm8k

dataset_limit: 50          # deterministic stratified subsample per dataset
dataset_seed: 13
router_holdout_fraction: 0.2
minimum_holdout_items: 20
slm_quality_tolerance: 0.05

# Candidate models the router may choose among (subset of models.yaml ids).
# These NVIDIA Build Developer Program endpoints are free for prototyping; the
# registry therefore reserves zero token spend for them.
candidate_models:
  - openai/gpt-oss-20b
  - google/gemma-4-31b-it

# LLM-as-judge uses the NVIDIA Build OpenAI-compatible endpoint.
judge_model: google/gemma-4-31b-it
judge_temperature: 0.0
