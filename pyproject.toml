[project]
name = "slm-router"
version = "0.1.0"
description = "Self-Improving Model Router for SLM-LLM Systems"
readme = "README.md"
requires-python = ">=3.12,<3.13"
exclude-newer = "7 days"
dependencies = [
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "diskcache>=5.6.0",
    "aiolimiter>=1.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",          # Patched micro-version
    "typer>=0.15.0",
    "fastapi>=0.115.0",       # Resolves older web endpoint flaws
    "uvicorn[standard]>=0.34.0", # Critical security baseline
    "numpy>=2.2.0",           # Bumps up to modern major data standards
    "scipy>=1.15.0",
    "pandas>=2.2.3",
    "scikit-learn>=1.6.0",
    "sentence-transformers>=3.3.0",
    "torch>=2.5.0",           # Patched heavy-compute safety floor
    "datasets>=3.2.0",
    "matplotlib>=3.10.0",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
obs = [
    "opentelemetry-sdk>=1.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "ipykernel>=6.29.5",
]

[project.scripts]
slm = "slm_router.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slm_router"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
