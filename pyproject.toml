[project]
name = "slm-router"
version = "0.1.0"
description = "Self-Improving Model Router for SLM-LLM Systems"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.4",
    "diskcache>=5.6",
    "aiolimiter>=1.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "datasets>=2.20",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
conformal = ["mapie>=0.8"]
nlp = ["spacy>=3.7"]
obs = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "langfuse>=2.44",
    "arize-phoenix>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
]

[project.scripts]
slm = "slm_router.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slm_router"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
